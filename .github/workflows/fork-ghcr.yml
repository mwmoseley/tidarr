name: Build fork image

# Fork-only workflow: builds this fork's `main` and publishes it to GHCR so it
# can be pulled on a personal server while changes wait on upstream PRs.
# Deliberately kept separate from docker-push.yml (upstream's Docker Hub
# release workflow) so it never conflicts when rebasing on upstream.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: Unraid is x86, and skipping arm64 avoids QEMU emulation,
      # which is very slow for the native Python deps (beets) in this image.
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: VERSION=fork-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tidarr:main
            ghcr.io/${{ github.repository_owner }}/tidarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
